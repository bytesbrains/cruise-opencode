# Tag-triggered publish only — a merge to main is never a release.
#
# Cutting a release:
#   1. Bump package.json version (and CHANGELOG) in a PR into main.
#   2. Merge the PR.
#   3. Tag the main commit: git tag v0.1.0 && git push origin v0.1.0
#   4. This workflow builds, packs, scans the tarball, then publishes to npm
#      via OIDC trusted publishing. The tag must point at a commit on main.
#
# workflow_dispatch defaults to dry_run=true (pack/validate only). Publishing
# still requires github.ref to be refs/tags/v* — dry_run=false on a branch never
# publishes. Set dry_run=false only when re-running against an existing v* tag.
#
# One-time npm setup: Trusted Publisher on npmjs for this package —
#   Owner: bytesbrains  Repo: cruise-opencode  Workflow: release.yml
# Optional break-glass: repository secret NPM_TOKEN.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing"
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the tag can be checked against origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      # Do NOT upgrade npm before `npm ci` / test: npm 11+ has known optional-deps
      # bugs that drop Vitest/Rolldown native bindings (npm/cli#4828). Upgrade only
      # immediately before `npm publish`, which needs ≥11.5.1 for OIDC.

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks_8.24.3_linux_x64.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks_8.24.3_linux_x64.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks_8.24.3_linux_x64.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Assert tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          # Test the value, not node's exit code: `node -p` exits 0 on true and false.
          if node -e 'process.exit(require("./package.json").private === true ? 0 : 1)'; then
            echo "package.json still has private:true — flip it before tagging a release"
            exit 1
          fi

      - name: Assert tag points at a commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # A tag cut from a feature branch would publish code main never reviewed.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          # --is-ancestor exits 0 (on main), 1 (not on main), or >1 on a git error;
          # keep the error distinct so it is not reported as "not on main".
          rc=0
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main — merge the release PR, then tag main"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "Could not check $GITHUB_SHA against origin/main (git exit $rc)"
            exit "$rc"
          fi

      - name: Pack and assert no secrets in the artifact
        run: npm run pack:check

      - name: Decide whether to publish
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "false" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Mode: dry_run — pack/validate only"
            exit 0
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Mode: publish"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Mode: not a v* tag — pack/validate only"
          fi

      - name: Publish to npm
        if: steps.gate.outputs.publish == 'true'
        env:
          # Prefer OIDC trusted publishing. Only set NODE_AUTH_TOKEN when the
          # optional break-glass NPM_TOKEN secret exists — an empty value blocks OIDC.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # OIDC trusted publishing needs npm ≥11.5.1 — upgrade here, after tests.
          npm install -g npm@11.5.1
          # setup-node may write an empty/placeholder _authToken; that blocks OIDC
          # and can race the break-glass env token. Strip only those empty forms —
          # never delete a real non-empty _authToken line.
          for f in .npmrc "$HOME/.npmrc"; do
            if [ -f "$f" ]; then
              sed -i.bak -E \
                -e '/_authToken[[:space:]]*=[[:space:]]*$/d' \
                -e '/_authToken[[:space:]]*=[[:space:]]*\$\{NODE_AUTH_TOKEN\}[[:space:]]*$/d' \
                "$f" || true
              rm -f "$f.bak"
            fi
          done
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Using break-glass NPM_TOKEN"
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "Using npm OIDC trusted publishing (no NPM_TOKEN)"
            unset NODE_AUTH_TOKEN || true
          fi
          # Trusted publishing attaches provenance automatically; --provenance
          # remains fine for the token fallback path.
          npm publish --access public --provenance
